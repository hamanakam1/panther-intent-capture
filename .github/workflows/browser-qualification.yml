name: Browser qualification

on:
  workflow_dispatch:
  schedule:
    # Weekly, off the hour, so a scheduled run never competes with other work.
    - cron: "37 6 * * 1"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install the browser-qualification tooling
        run: npm ci

      - name: Install the Chromium build used for the qualification run
        run: npx playwright-core install --with-deps chromium

      - name: Qualify the extension in a real browser
        run: node scripts/qualify_browser.mjs --report browser-qualification.md

      - name: Retain the qualification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-qualification
          path: browser-qualification.md
          if-no-files-found: ignore
