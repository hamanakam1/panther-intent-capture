name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Stacked pull requests target a feature branch rather than main. They
    # need the same checks, or a change can sit in a stack without ever being
    # tested.
    branches: [main, "fix/**", "feature/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Capture, consent and redaction regressions
        run: node --test tests/*.mjs
      - name: Install schema test dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Storage, HTTP and dashboard adapter regressions
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and validate extension ZIP
        run: python scripts/package_extension.py
      - name: Retain unpackable extension
        if: matrix.python == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panther-intent-capture-chromium
          path: dist/panther-intent-capture.zip
          archive: true
